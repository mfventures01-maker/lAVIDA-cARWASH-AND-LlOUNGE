<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D58A" />
      <stop offset="25%" stop-color="#D6A64B" />
      <stop offset="50%" stop-color="#FFE8B0" />
      <stop offset="75%" stop-color="#B38029" />
      <stop offset="100%" stop-color="#E5BE65" />
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8E6316" />
      <stop offset="50%" stop-color="#F4D58A" />
      <stop offset="100%" stop-color="#D6A64B" />
    </linearGradient>

    <radialGradient id="crestGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7E1020" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#050505" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050505" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="crimsonGown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C51F35" />
      <stop offset="60%" stop-color="#7E1020" />
      <stop offset="100%" stop-color="#3A050D" />
    </linearGradient>

    <linearGradient id="carwashSpray" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="snookerTableCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9E57" />
      <stop offset="50%" stop-color="#087A43" />
      <stop offset="100%" stop-color="#044D29" />
    </linearGradient>

    <!-- Filters for Gloss & Glow -->
    <filter id="goldDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#7E1020" flood-opacity="0.6" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Crest with Pointed Lower Edge -->
  <g id="crestBackground">
    <!-- Outer Crest Border -->
    <path d="M 400 30
             C 610 30, 770 190, 770 400
             C 770 530, 700 640, 590 705
             L 400 785
             L 210 705
             C 100 640, 30 530, 30 400
             C 30 190, 190 30, 400 30 Z"
          fill="#050505"
          stroke="url(#goldGradient)"
          stroke-width="7"
          filter="url(#goldDropShadow)" />

    <!-- Inner Inset Crest Border -->
    <path d="M 400 48
             C 595 48, 750 200, 750 400
             C 750 520, 685 625, 580 688
             L 400 762
             L 220 688
             C 115 625, 50 520, 50 400
             C 50 200, 205 48, 400 48 Z"
          fill="url(#crestGlow)"
          stroke="url(#goldRim)"
          stroke-width="2.5"
          stroke-dasharray="6,3" />
  </g>

  <!-- Upper Center: Elegant Adult Feminine Silhouette in Deep Crimson Gown with Gold Rim Light -->
  <g id="feminineSilhouette" transform="translate(400, 230)">
    <!-- Backing Glow -->
    <ellipse cx="0" cy="-35" rx="55" ry="75" fill="#7E1020" opacity="0.35" filter="url(#softGlow)" />

    <!-- Flowing Hair Behind -->
    <path d="M -15 -85
             C -45 -70, -65 -30, -55 20
             C -45 55, -25 75, -15 90
             C -25 60, -35 20, -25 -25
             C -20 -55, 0 -80, -15 -85 Z"
          fill="#050505"
          stroke="url(#goldGradient)"
          stroke-width="1.5" />

    <!-- Stylized Elegant Profile -->
    <path d="M -2 -92
             C 15 -92, 28 -78, 26 -60
             C 25 -52, 20 -44, 18 -38
             C 24 -36, 30 -30, 26 -24
             C 22 -19, 14 -20, 12 -12
             C 10 -2, 16 12, 18 25
             C 12 28, 4 28, -2 24
             C -12 18, -16 6, -16 -12
             C -16 -40, -18 -68, -2 -92 Z"
          fill="#120508"
          stroke="url(#goldRim)"
          stroke-width="1.8" />

    <!-- Fitted Deep-Crimson Evening Gown -->
    <path d="M -4 20
             C 10 22, 20 28, 28 45
             C 34 60, 38 85, 42 110
             C 45 125, 30 135, 12 138
             C -8 140, -25 132, -28 115
             C -32 90, -28 65, -22 45
             C -16 28, -12 20, -4 20 Z"
          fill="url(#crimsonGown)"
          stroke="url(#goldGradient)"
          stroke-width="2" />

    <!-- Gold Accent Necklace / Choker -->
    <path d="M 0 16 C 8 18, 14 18, 20 15" stroke="url(#goldGradient)" stroke-width="2.5" fill="none" />
  </g>

  <!-- Left: Luxury Sedan with Water Spray, Foam and Reflections (Carwash) -->
  <g id="carwashEmblem" transform="translate(195, 290)">
    <!-- Water Jet / Foam Spray Trails -->
    <path d="M -70 -70 C -40 -30, -20 -10, 0 10" stroke="url(#carwashSpray)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M -90 -45 C -55 -15, -30 0, 15 20" stroke="url(#carwashSpray)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M -75 -20 C -45 5, -15 20, 30 35" stroke="url(#carwashSpray)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Foaming Micro-bubbles -->
    <circle cx="-35" cy="-25" r="4" fill="#FFFFFF" opacity="0.8" />
    <circle cx="-15" cy="-8" r="3" fill="#38BDF8" opacity="0.7" />
    <circle cx="-50" cy="-5" r="5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="10" cy="18" r="3.5" fill="#FFFFFF" opacity="0.9" />

    <!-- Sleek Luxury Sedan Profile Silhouette (No visible manufacturer badge) -->
    <path d="M -105 55
             C -90 40, -65 35, -30 32
             L 10 22
             C 35 15, 60 20, 95 38
             L 115 50
             C 125 55, 128 65, 120 72
             L -95 72
             C -105 72, -112 65, -105 55 Z"
          fill="#0A0A0A"
          stroke="url(#goldGradient)"
          stroke-width="2.5" />

    <!-- Cabin Greenhouse / Tinted Windows -->
    <path d="M -25 32
             L 12 24
             C 28 20, 48 24, 75 36
             L -10 36 Z"
          fill="#1C2735"
          stroke="url(#goldRim)"
          stroke-width="1.5" />

    <!-- High-Gloss Hood & Door Reflections -->
    <path d="M -85 52 L -30 46 L 60 48" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

    <!-- Wheels with Ceramic Rim Glow -->
    <circle cx="-65" cy="72" r="16" fill="#050505" stroke="url(#goldGradient)" stroke-width="2.5" />
    <circle cx="-65" cy="72" r="7" fill="#222222" stroke="url(#goldRim)" stroke-width="1.5" />

    <circle cx="65" cy="72" r="16" fill="#050505" stroke="url(#goldGradient)" stroke-width="2.5" />
    <circle cx="65" cy="72" r="7" fill="#222222" stroke="url(#goldRim)" stroke-width="1.5" />
  </g>

  <!-- Right: Green-Felt Snooker Table, Cue and Balls with Warm Bar Lighting -->
  <g id="snookerLoungeEmblem" transform="translate(605, 290)">
    <!-- Warm Ambient Bar Chandelier Glow -->
    <ellipse cx="0" cy="-60" rx="45" ry="18" fill="#F4D58A" opacity="0.25" filter="url(#softGlow)" />
    <line x1="-30" y1="-60" x2="30" y2="-60" stroke="url(#goldGradient)" stroke-width="2" />
    <line x1="0" y1="-85" x2="0" y2="-60" stroke="url(#goldRim)" stroke-width="1.5" />

    <!-- Isometric Snooker Table (Strachan Green Felt) -->
    <polygon points="-90,45 20,18 105,42 -5,72"
             fill="url(#snookerTableCloth)"
             stroke="url(#goldGradient)"
             stroke-width="2.5" />

    <!-- Table Wooden Cushion Railing -->
    <polygon points="-95,43 20,15 110,40 105,47 20,22 -90,49"
             fill="#4A1E0D"
             stroke="url(#goldRim)"
             stroke-width="1.2" />

    <!-- Snooker Balls: Red Pack & Yellow/Black/White -->
    <circle cx="10" cy="40" r="5" fill="#C51F35" stroke="#FFFFFF" stroke-width="0.5" />
    <circle cx="20" cy="38" r="5" fill="#C51F35" />
    <circle cx="15" cy="47" r="5" fill="#C51F35" />
    <circle cx="28" cy="44" r="5" fill="#C51F35" />
    <circle cx="-25" cy="50" r="5.5" fill="#F7F4EE" stroke="#A7A7A7" stroke-width="0.8" /> <!-- Cue ball -->
    <circle cx="55" cy="36" r="5" fill="#050505" stroke="url(#goldRim)" stroke-width="1" /> <!-- 8-ball -->

    <!-- Snooker Cue Stick (Tapered) -->
    <line x1="-80" y1="78" x2="-35" y2="54" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" />
    <line x1="-35" y1="54" x2="-28" y2="51" stroke="#F7F4EE" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Central Brand Typography: LAVIDA -->
  <g id="brandTitle" transform="translate(400, 480)">
    <!-- Shadow for Depth -->
    <text x="0" y="5"
          text-anchor="middle"
          font-family="'Cinzel', 'Playfair Display', Georgia, serif"
          font-size="94"
          font-weight="900"
          letter-spacing="14"
          fill="#3A050D"
          opacity="0.9"
          filter="url(#goldDropShadow)">
      LAVIDA
    </text>

    <!-- Foreground Metallic Gold Lettering -->
    <text x="0" y="0"
          text-anchor="middle"
          font-family="'Cinzel', 'Playfair Display', Georgia, serif"
          font-size="94"
          font-weight="900"
          letter-spacing="14"
          fill="url(#goldGradient)"
          stroke="#5C4010"
          stroke-width="1.5">
      LAVIDA
    </text>
  </g>

  <!-- Subtitle: CARWASH AND LOUNGE in Spaced Ivory Sans-Serif -->
  <g id="brandSubtitle" transform="translate(400, 532)">
    <line x1="-280" y1="-8" x2="-180" y2="-8" stroke="url(#goldGradient)" stroke-width="1.5" />
    <circle cx="-175" cy="-8" r="2.5" fill="#D6A64B" />

    <text x="0" y="0"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', Arial, sans-serif"
          font-size="19"
          font-weight="700"
          letter-spacing="9"
          fill="#F7F4EE">
      CARWASH AND LOUNGE
    </text>

    <circle cx="175" cy="-8" r="2.5" fill="#D6A64B" />
    <line x1="180" y1="-8" x2="280" y2="-8" stroke="url(#goldGradient)" stroke-width="1.5" />
  </g>

  <!-- Service Row Along Bottom with 5 Gold Service Symbols and Labels -->
  <!-- CARWASH · FOOD · DRINKS · SNOOKER · KARAOKE & GAMES -->
  <g id="serviceRow" transform="translate(400, 620)">
    <!-- Divider Arch -->
    <path d="M -260 -25 C -130 -40, 130 -40, 260 -25" stroke="url(#goldRim)" stroke-width="1" fill="none" opacity="0.6" />

    <!-- 1. CARWASH -->
    <g transform="translate(-210, 0)">
      <!-- Car Icon -->
      <path d="M -12 2 L -8 -5 L 8 -5 L 12 2 L 14 5 L -14 5 Z" fill="none" stroke="url(#goldGradient)" stroke-width="1.4" />
      <circle cx="-7" cy="8" r="2.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" />
      <circle cx="7" cy="8" r="2.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" />
      <!-- Water Drops -->
      <circle cx="0" cy="-9" r="1.2" fill="#38BDF8" />
      <circle cx="-6" cy="-11" r="1" fill="#38BDF8" />
      <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#D6A64B">
        CARWASH
      </text>
    </g>

    <circle cx="-135" cy="8" r="1.5" fill="#D6A64B" opacity="0.6" />

    <!-- 2. FOOD -->
    <g transform="translate(-80, 0)">
      <!-- Fork and Knife -->
      <path d="M -4 -8 L -4 0 L 0 0 L 0 8 M -4 -8 L -4 -2 M -2 -8 L -2 0 M -6 -8 L -6 -2" stroke="url(#goldGradient)" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <path d="M 4 -8 C 7 -4, 7 0, 4 2 L 4 8" stroke="url(#goldGradient)" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#D6A64B">
        FOOD
      </text>
    </g>

    <circle cx="-25" cy="8" r="1.5" fill="#D6A64B" opacity="0.6" />

    <!-- 3. DRINKS -->
    <g transform="translate(0, 0)">
      <!-- Cocktail Glass -->
      <path d="M -8 -8 L 8 -8 L 0 0 L 0 7 M -5 7 L 5 7" stroke="url(#goldGradient)" stroke-width="1.3" fill="none" stroke-linecap="round" />
      <circle cx="0" cy="-4" r="1.2" fill="#C51F35" />
      <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#D6A64B">
        DRINKS
      </text>
    </g>

    <circle cx="35" cy="8" r="1.5" fill="#D6A64B" opacity="0.6" />

    <!-- 4. SNOOKER -->
    <g transform="translate(85, 0)">
      <!-- 8-Ball -->
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.3" />
      <circle cx="0" cy="0" r="3.2" fill="#D6A64B" />
      <text x="0" y="2" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="900" fill="#050505">8</text>
      <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#D6A64B">
        SNOOKER
      </text>
    </g>

    <circle cx="145" cy="8" r="1.5" fill="#D6A64B" opacity="0.6" />

    <!-- 5. KARAOKE & GAMES -->
    <g transform="translate(205, 0)">
      <!-- Music Note / Mic -->
      <path d="M -4 5 L -4 -6 L 4 -4 L 4 7" stroke="url(#goldGradient)" stroke-width="1.3" fill="none" stroke-linecap="round" />
      <circle cx="-6" cy="5" r="2.5" fill="url(#goldGradient)" />
      <circle cx="2" cy="7" r="2.5" fill="url(#goldGradient)" />
      <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#D6A64B">
        KARAOKE &amp; GAMES
      </text>
    </g>
  </g>

  <!-- Pointed Lower Ornamental Finial Star -->
  <g transform="translate(400, 742)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="url(#goldGradient)" />
  </g>
</svg>
